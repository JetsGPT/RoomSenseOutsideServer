<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your RoomSense account to access your smart room monitoring dashboard.">
    <meta name="theme-color" content="#79BC9E">
    <title>Login - RoomSense</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2379BC9E' stroke-width='2'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/></svg>">
</head>

<body>
    <!-- Header injected by main.js -->

    <main class="hero min-h-screen">
        <div class="hero-bg"></div>
        <div class="hero-orb hero-orb-1"></div>
        <div class="hero-orb hero-orb-2"></div>

        <div class="container relative z-10 flex justify-center items-center py-8">
            <div class="auth-card animate-fade-in-up">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">RoomSense</h1>
                    <p class="text-muted">Welcome back! Sign in to access your dashboard.</p>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="alert alert-error mb-4 hidden animate-scale-in">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span id="error-text"></span>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="flex-col gap-4">
                    <!-- Email Field -->
                    <div class="mb-4">
                        <label for="email" class="label">Email</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" class="input input-icon" placeholder="name@example.com"
                                required autocomplete="email">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <div class="flex justify-between items-center">
                            <label for="password" class="label" style="margin-bottom: 0;">Password</label>
                            <a href="forgot-password.html" class="text-xs text-primary" style="text-decoration: underline;">Forgot password?</a>
                        </div>
                        <div class="input-wrapper">
                            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="password" class="input input-icon" placeholder="••••••••"
                                required autocomplete="current-password" style="padding-right: 3rem;">
                            <button type="button" id="toggle-password" class="icon-right btn btn-ghost btn-icon-sm">
                                <svg id="eye-icon" class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg id="eye-off-icon" class="icon-sm hidden" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                    </path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-full">
                        <span id="btn-text">Sign In</span>
                        <span id="btn-loading" class="hidden flex items-center gap-2">
                            <span class="spinner"></span>
                            Signing in...
                        </span>
                    </button>
                </form>

                <!-- Register Link -->
                <div class="text-center mt-6">
                    <p class="text-sm text-muted">
                        Don't have an account?
                        <a href="register.html" class="text-primary font-medium" style="text-decoration: underline;">
                            Create one
                        </a>
                    </p>
                </div>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    <span class="text-xs text-muted">OR</span>
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>

                <!-- Back to Home -->
                <a href="index.html" class="btn btn-ghost w-full">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"></path>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    <!-- Footer injected by main.js -->

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');
        const togglePassword = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('hidden', !isPassword);
            eyeOffIcon.classList.toggle('hidden', isPassword);
        });

        // Show error
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        // Hide error
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Set loading state
        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.classList.toggle('hidden', loading);
            btnLoading.classList.toggle('hidden', !loading);
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            setLoading(true);

            try {
                await login(email, password);
                // Success - redirect to dashboard or home
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError(error.message || 'Login failed. Please try again.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>

</html>
