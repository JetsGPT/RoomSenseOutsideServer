<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your RoomSense password - We'll send you a recovery link.">
    <title>Forgot Password - RoomSense</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2379BC9E' stroke-width='2'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/></svg>">
</head>

<body>
    <!-- Header injected by main.js -->

    <main class="hero min-h-screen">
        <div class="hero-bg"></div>
        <div class="hero-orb hero-orb-1"></div>
        <div class="hero-orb hero-orb-2"></div>

        <div class="container relative z-10 flex justify-center items-center py-8">
            <div class="auth-card animate-fade-in-up">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="feature-icon mx-auto mb-4" style="width: 4rem; height: 4rem;">
                        <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 7a2 2 0 0 1 2 2m4 0a6 6 0 0 1-7.743 5.743L11 17H9v2H7v2H4a1 1 0 0 1-1-1v-2.586a1 1 0 0 1 .293-.707l5.964-5.964A6 6 0 1 1 21 9z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold mb-2">Forgot Password?</h1>
                    <p class="text-muted">No worries! Enter your email and we'll send you a reset link.</p>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="alert alert-error mb-4 hidden animate-scale-in">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span id="error-text"></span>
                </div>

                <!-- Success Message -->
                <div id="success-message" class="alert alert-success mb-4 hidden animate-scale-in">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span id="success-text">Check your email! We've sent you a password reset link.</span>
                </div>

                <!-- Reset Form -->
                <form id="reset-form" class="flex-col gap-4">
                    <!-- Email Field -->
                    <div class="mb-6">
                        <label for="email" class="label">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" class="input input-icon" placeholder="name@example.com"
                                required autocomplete="email">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-full">
                        <span id="btn-text">Send Reset Link</span>
                        <span id="btn-loading" class="hidden flex items-center gap-2">
                            <span class="spinner"></span>
                            Sending...
                        </span>
                    </button>
                </form>

                <!-- Back to Login -->
                <div class="text-center mt-6">
                    <p class="text-sm text-muted">
                        Remember your password?
                        <a href="login.html" class="text-primary font-medium" style="text-decoration: underline;">
                            Sign in
                        </a>
                    </p>
                </div>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    <span class="text-xs text-muted">OR</span>
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>

                <!-- Back to Home -->
                <a href="index.html" class="btn btn-ghost w-full">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"></path>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    <!-- Footer injected by main.js -->

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        const form = document.getElementById('reset-form');
        const emailInput = document.getElementById('email');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess() {
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.classList.toggle('hidden', loading);
            btnLoading.classList.toggle('hidden', !loading);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();

            if (!email) {
                showError('Please enter your email address');
                return;
            }

            setLoading(true);

            try {
                // In production, call your API endpoint for password reset
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                // Even if API fails, show success (for security - don't reveal if email exists)
                showSuccess();
                form.reset();
            } catch (error) {
                // Still show success for security reasons
                showSuccess();
                form.reset();
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>

</html>
